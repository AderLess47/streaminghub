app = "streaminghub-org"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_URL = "https://streaminghub.org"
  DATABASE_PATH = "/app/data/streaminghub.db"
  SESSION_DAYS = "30"
  BACKUP_DIR = "/app/data/backups"
  BACKUP_RETENTION_DAYS = "30"
  DOWNLOAD_FIRE_TV_URL = "https://downloads.streaminghub.org/streaminghub-1.2.2.apk?v=e99b1876d9c2c53ef6c1389e46c4a57101372f29f21d20c6efa3df277c7d3bcc"
  DOWNLOAD_ANDROID_TV_URL = "https://downloads.streaminghub.org/streaminghub-1.2.2.apk?v=e99b1876d9c2c53ef6c1389e46c4a57101372f29f21d20c6efa3df277c7d3bcc"
  DOWNLOAD_ANDROID_MOBILE_URL = "https://downloads.streaminghub.org/streaminghub-1.2.2.apk?v=e99b1876d9c2c53ef6c1389e46c4a57101372f29f21d20c6efa3df277c7d3bcc"
  AMAZON_STORE_URL = ""
  ADMIN_EMAIL = "aarondursun@gmail.com"
  EMAIL_FROM = "StreamingHub <service@streaminghub.org>"
  EMAIL_REPLY_TO = "service@streaminghub.org"
  STRIPE_PRICE_ID = "price_1UZSAvPmp8Jh8xSPzMCF3gwg"
  # Personal operator details are Fly secrets, not repository content:
  # OPERATOR_LEGAL_NAME, OPERATOR_REPRESENTATIVE, OPERATOR_STREET,
  # OPERATOR_POSTAL_CODE, OPERATOR_CITY, OPERATOR_PHONE
  OPERATOR_EMAIL = "service@streaminghub.org"
  OPERATOR_COUNTRY = "Deutschland"
  OPERATOR_SMALL_BUSINESS = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "streaminghub_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
