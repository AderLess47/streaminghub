# Xcode-Projekt aus einer Textdatei erzeugen:
#   brew install xcodegen
#   cd apple && xcodegen generate
#
# Ein handgeschriebenes .pbxproj wäre schwer zu prüfen; diese Datei beschreibt
# dasselbe Ziel in wenigen Zeilen und ist im Diff lesbar.
name: StreamingHub
options:
  bundleIdPrefix: org.streaminghub
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true

packages:
  StreamingHubCore:
    path: .

targets:
  StreamingHub:
    type: application
    # Apple TV ist dieselbe App auf derselben Bundle-ID (Universal Purchase):
    # ein Kauf gilt damit auf iPhone, iPad, Mac und Apple TV.
    platform: [iOS, macOS, tvOS]
    sources:
      - path: StreamingHub
    dependencies:
      - package: StreamingHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.streaminghub.app
        PRODUCT_NAME: StreamingHub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StreamingHub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "StreamingHub"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
