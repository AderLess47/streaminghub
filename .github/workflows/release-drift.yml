name: Release-Abweichung

on:
  schedule:
    # Daily at 05:17 UTC, after the nightly release window.
    - cron: "17 5 * * *"
  # Runs right after every Android release, so a fallback that a release left
  # behind is visible the same day instead of at the next scheduled check.
  workflow_run:
    workflows: ["Android-Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: false

jobs:
  check:
    name: Fallback mit Produktion vergleichen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A cancelled or failed release published nothing, so it needs no drift report.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # No dependency install: the sync only uses fetch and node:fs, so the check
      # stays fast and needs no secrets or network egress beyond the site.
      - name: Eingetragene Release-Metadaten mit Produktion vergleichen
        env:
          RELEASE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if node scripts/release-sync.mjs --check; then
            echo "Eingetragener Fallback stimmt mit Produktion überein (Auslöser: ${GITHUB_EVENT_NAME})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Reproduce the drift in the runner so the log and summary show it.
          node scripts/release-sync.mjs
          {
            echo "### Release-Fallback ist veraltet"
            echo
            echo "src/content/release.ts liegt hinter https://streaminghub.org/api/release zurück (Auslöser: \`${GITHUB_EVENT_NAME}\`)."
            if [ -n "${RELEASE_RUN_URL}" ]; then
              echo
              echo "Ausgelöst durch Release-Lauf: ${RELEASE_RUN_URL}"
            fi
            echo
            echo "Lokal \`npm run release:sync\` ausführen und einen Pull Request öffnen."
            echo
            echo '```diff'
            git --no-pager diff -- src/content/release.ts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Release-Fallback ist veraltet::src/content/release.ts liegt hinter https://streaminghub.org/api/release zurück. 'npm run release:sync' ausführen und einen Pull Request öffnen."
          exit 1
