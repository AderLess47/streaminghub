name: Android-Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Bauen, hochladen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK-Pakete installieren
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            exit "$license_status"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      # Gradle-Caches gehoeren setup-gradle: setup-java mit "cache: gradle"
      # legt ~/.gradle vorher an, worauf setup-gradle Restore und Save
      # ueberspringt und jeder Lauf die Abhaengigkeiten neu laedt.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Release-Secrets prüfen
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN FLY_API_TOKEN ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Erforderliches Secret fehlt: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Android-Signierungskonfiguration wiederherstellen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/streaminghub-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "keystore/streaminghub-release.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > android/local.properties
          chmod 600 android/keystore.properties android/keystore/streaminghub-release.jks

      - name: Node-Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Website typechecken
        run: npm run typecheck

      # Builds, signs and uploads the APK, verifies the public object, updates the
      # release metadata files and exports APK_* to GITHUB_ENV.
      - name: APK bauen, hochladen und prüfen
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run release:apk

      # The Amazon Appstore build sells premium through Amazon IAP
      # (BuildConfig.PREMIUM_SALES=true, channel amazon, see docs/IAP-AMAZON.md).
      # It is never published on the public download page; the run attaches it
      # for the console upload instead.
      - name: Amazon-Appstore-APK bauen, prüfen und anhängen
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleAmazonRelease
          APK="app/build/outputs/apk/amazon/release/app-amazon-release.apk"
          test -f "$APK"
          grep -q 'PREMIUM_SALES = true' \
            "app/build/generated/source/buildConfig/amazon/release/de/streaminghub/app/BuildConfig.java"
          grep -q 'PREMIUM_CHANNEL = "amazon"' \
            "app/build/generated/source/buildConfig/amazon/release/de/streaminghub/app/BuildConfig.java"
          # The SDK classes live in classes.dex, so assert the resolved dependency.
          ./gradlew --no-daemon -q :app:dependencies --configuration amazonReleaseRuntimeClasspath \
            | grep -q 'amazon-appstore-sdk:3.0.9'
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='${APK_VERSION}'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='${APK_VERSION_CODE}'"
          echo "Amazon-APK: $(stat -c%s "$APK") Bytes, $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Amazon-Appstore-APK anhängen
        uses: actions/upload-artifact@v4
        with:
          name: streaminghub-amazon-apk
          path: android/app/build/outputs/apk/amazon/release/app-amazon-release.apk
          if-no-files-found: error

      # Play erlaubt keinen Web-Checkout. Der Play-Build hat deshalb keinen
      # Kaufweg (PREMIUM_SALES=false); Google Play Billing folgt separat.
      - name: Google-Play-AAB bauen und prüfen
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon bundlePlayRelease
          AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -f "$AAB"
          grep -q 'PREMIUM_SALES = false' \
            "app/build/generated/source/buildConfig/play/release/de/streaminghub/app/BuildConfig.java"
          grep -q 'PREMIUM_CHANNEL = "play"' \
            "app/build/generated/source/buildConfig/play/release/de/streaminghub/app/BuildConfig.java"
          jarsigner -verify "$AAB"
          echo "Play-AAB: $(stat -c%s "$AAB") Bytes, $(sha256sum "$AAB" | cut -d' ' -f1)"

      - name: Google-Play-AAB anhängen
        uses: actions/upload-artifact@v4
        with:
          name: streaminghub-play-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: flyctl installieren
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      # The website reads APK_* at request time (src/lib/android-release.ts), so
      # publishing the release itself is a secret update: no commit to the
      # protected branch and no deploy are involved.
      - name: Release-Metadaten als Fly-Secrets veröffentlichen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets set --app streaminghub-org \
            APK_VERSION="$APK_VERSION" \
            APK_VERSION_CODE="$APK_VERSION_CODE" \
            APK_FILE_NAME="$APK_FILE_NAME" \
            APK_SHA256="$APK_SHA256" \
            APK_SIZE_BYTES="$APK_SIZE_BYTES" \
            APK_URL="$APK_URL"

      # Same check that runs after every deploy: page, API and served APK must
      # describe one release. The checksum changes with every build, so it proves
      # the secrets were applied even when the version stays the same.
      - name: Deployte Website prüfen
        run: node scripts/deploy-smoke.mjs --wait 300

      # `npm run release:apk` rewrote the generated files in this runner, but it
      # must not commit to the protected branch. It therefore parks the changes on
      # a stable branch and keeps one pull request open, so syncing the repository
      # is a single merge.
      - name: Pull Request für die Release-Metadaten vorbereiten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="release/metadata-sync"
          # Only the version data changed; URLs live nowhere else in the repository.
          git add -- src/content/release.ts

          if git diff --cached --quiet; then
            echo "Die committeten Release-Metadaten sind bereits aktuell; kein Pull Request nötig."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(release): ${APK_VERSION}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
          fi
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Erzeugte Release-Metadaten für **${APK_VERSION}** (Build ${APK_VERSION_CODE}).

          | Feld | Wert |
          | --- | --- |
          | Datei | \`${APK_FILE_NAME}\` |
          | Größe | ${APK_SIZE_BYTES} Bytes |
          | SHA-256 | \`${APK_SHA256}\` |

          Produktion liest diese Werte zur Laufzeit aus den Fly-Secrets; dieser
          Commit hält nur den lokalen Fallback \`src/content/release.ts\` aktuell.

          **Merge-Hinweis:** Pull Requests, die mit \`GITHUB_TOKEN\` erstellt werden,
          starten keine CI-Läufe. Der erforderliche Check \`Typecheck and tests\`
          fehlt deshalb; der Merge erfolgt als Administrator über „Merge without
          waiting for requirements“ (ein Klick).
          EOF

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore(release): ${APK_VERSION}" --body-file "$BODY"
            echo "Pull Request #${EXISTING} aktualisiert."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): ${APK_VERSION}" \
              --body-file "$BODY" | tail -1
          fi
