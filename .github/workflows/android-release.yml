name: Android release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, upload and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            exit "$license_status"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN FLY_API_TOKEN ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/streaminghub-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "keystore/streaminghub-release.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > android/local.properties
          chmod 600 android/keystore.properties android/keystore/streaminghub-release.jks

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck website
        run: npm run typecheck

      # Builds, signs and uploads the APK, verifies the public object, updates the
      # release metadata files and exports APK_* to GITHUB_ENV.
      - name: Build, upload and verify APK
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run release:apk

      # The Amazon Appstore build sells premium through Amazon IAP
      # (BuildConfig.PREMIUM_SALES=true, channel amazon, see docs/IAP-AMAZON.md).
      # It is never published on the public download page; the run attaches it
      # for the console upload instead.
      - name: Build, verify and attach the Amazon Appstore APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleAmazonRelease
          APK="app/build/outputs/apk/amazon/release/app-amazon-release.apk"
          test -f "$APK"
          grep -q 'PREMIUM_SALES = true' \
            "app/build/generated/source/buildConfig/amazon/release/de/streaminghub/app/BuildConfig.java"
          grep -q 'PREMIUM_CHANNEL = "amazon"' \
            "app/build/generated/source/buildConfig/amazon/release/de/streaminghub/app/BuildConfig.java"
          # The SDK classes live in classes.dex, so assert the resolved dependency.
          ./gradlew --no-daemon -q :app:dependencies --configuration amazonReleaseRuntimeClasspath \
            | grep -q 'amazon-appstore-sdk:3.0.9'
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='${APK_VERSION}'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='${APK_VERSION_CODE}'"
          echo "Amazon APK: $(stat -c%s "$APK") bytes, $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Attach the Amazon Appstore APK
        uses: actions/upload-artifact@v4
        with:
          name: streaminghub-amazon-apk
          path: android/app/build/outputs/apk/amazon/release/app-amazon-release.apk
          if-no-files-found: error

      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      # The website reads APK_* at request time (src/lib/android-release.ts), so
      # publishing the release itself is a secret update: no commit to the
      # protected branch and no deploy are involved.
      - name: Publish release metadata as Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets set --app streaminghub-org \
            APK_VERSION="$APK_VERSION" \
            APK_VERSION_CODE="$APK_VERSION_CODE" \
            APK_FILE_NAME="$APK_FILE_NAME" \
            APK_SHA256="$APK_SHA256" \
            APK_SIZE_BYTES="$APK_SIZE_BYTES" \
            APK_URL="$APK_URL"

      # Same check that runs after every deploy: page, API and served APK must
      # describe one release. The checksum changes with every build, so it proves
      # the secrets were applied even when the version stays the same.
      - name: Verify the deployed site
        run: node scripts/deploy-smoke.mjs --wait 300

      # `npm run release:apk` rewrote the generated files in this runner, but it
      # must not commit to the protected branch. It therefore parks the changes on
      # a stable branch and keeps one pull request open, so syncing the repository
      # is a single merge.
      - name: Prepare the release metadata pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="release/metadata-sync"
          # Only the version data changed; URLs live nowhere else in the repository.
          git add -- src/content/release.ts

          if git diff --cached --quiet; then
            echo "Committed release metadata is already current; no pull request needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(release): ${APK_VERSION}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
          fi
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Generated release metadata for **${APK_VERSION}** (build ${APK_VERSION_CODE}).

          | Feld | Wert |
          | --- | --- |
          | Datei | \`${APK_FILE_NAME}\` |
          | Größe | ${APK_SIZE_BYTES} Bytes |
          | SHA-256 | \`${APK_SHA256}\` |

          Produktion liest diese Werte zur Laufzeit aus den Fly-Secrets; dieser
          Commit hält nur den lokalen Fallback \`src/content/release.ts\` aktuell.

          **Merge-Hinweis:** Pull Requests, die mit \`GITHUB_TOKEN\` erstellt werden,
          starten keine CI-Läufe. Der erforderliche Check \`Typecheck and tests\`
          fehlt deshalb; der Merge erfolgt als Administrator über „Merge without
          waiting for requirements“ (ein Klick).
          EOF

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore(release): ${APK_VERSION}" --body-file "$BODY"
            echo "Updated pull request #${EXISTING}."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): ${APK_VERSION}" \
              --body-file "$BODY" | tail -1
          fi
