name: Android release

on:
  workflow_dispatch:
    inputs:
      commit_metadata:
        description: "Release metadata (release.ts, fly.toml, .env.example) back to the branch"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, upload and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            exit "$license_status"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN FLY_API_TOKEN ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/streaminghub-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "keystore/streaminghub-release.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > android/local.properties
          chmod 600 android/keystore.properties android/keystore/streaminghub-release.jks

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck website
        run: npm run typecheck

      - name: Build, upload and verify APK
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run release:apk

      # The metadata commit used to be pushed straight to the protected branch,
      # which only worked while branch protection was suspended. It now travels
      # through its own pull request, so protection stays enabled.
      - name: Commit release metadata through a pull request
        if: ${{ inputs.commit_metadata == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="${GITHUB_REF_NAME}"
          if git diff --quiet -- src/content/release.ts fly.toml .env.example; then
            echo "No release metadata changes to commit."
            exit 0
          fi
          version=$(awk -F'"' '/versionName[[:space:]]*=/ { print $2; exit }' android/app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from android/app/build.gradle.kts"
            exit 1
          fi
          branch="release/metadata-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/release.ts fly.toml .env.example
          git commit -m "chore(release): APK ${version} [skip ci]"
          git push origin "HEAD:${branch}"

          pr_url=$(gh pr create --base "$base" --head "$branch" \
            --title "chore(release): APK ${version}" \
            --body "Release metadata for APK ${version}: points \`src/content/release.ts\`, \`fly.toml\` and \`.env.example\` at the uploaded R2 object.")
          pr_number="${pr_url##*/}"
          echo "metadata_pr=#${pr_number}"

          # Workflows are not started by events created with GITHUB_TOKEN, so the
          # required check has to be requested explicitly for the metadata branch.
          gh workflow run ci.yml --ref "$branch"
          registered=0
          for _ in $(seq 1 36); do
            if gh pr checks "$pr_number" 2>/dev/null | grep -q "Typecheck and tests"; then
              registered=1
              break
            fi
            sleep 5
          done
          if [ "$registered" -ne 1 ]; then
            echo "::error::CI did not start for PR #${pr_number}; merge ${branch} manually and deploy."
            exit 1
          fi
          gh pr checks "$pr_number" --watch --fail-fast
          gh pr merge "$pr_number" --rebase --delete-branch

          git fetch origin "$base"
          git checkout -B "$base" "origin/${base}"
          echo "metadata_merged_into_main=$(git rev-parse --short HEAD)"

      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy merged main to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app streaminghub-org --yes --remote-only
