name: Staging billing canary

# Runs manually, daily, and after any successful Deploy staging run. Automatic
# runs download the exact commit recorded by that deploy, so custom refs and
# non-main deploys are verified without trusting the default-branch tip.
on:
  # Daily at 05:47 UTC, after the Amazon sync (04:41) and release drift check
  # (05:17). A scheduled run also catches staging that has fallen behind main.
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Nur eine Slack-Testnachricht senden; Canary überspringen"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Run the staging billing canary
    if: (github.event_name == 'workflow_dispatch' && inputs.test_slack != true) || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Resolve deployed commit
        if: github.event_name == 'workflow_run'
        id: deployed_commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/deployed-commit"
          gh run download "$DEPLOY_RUN_ID" -n deployed-commit -D "$artifact_dir"
          commit="$(tr -d '[:space:]' < "$artifact_dir/commit.txt")"
          case "$commit" in
            ""|*[!0-9a-f]*)
              echo "::error::The deploy artifact does not contain a valid commit SHA."
              exit 1
              ;;
          esac
          if [ "${#commit}" -ne 40 ]; then
            echo "::error::The deploy artifact commit is not a full 40-character SHA."
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployed_commit.outputs.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sweep preflight (dry run)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          # Explicitly keep the preflight non-destructive even if a repository
          # variable or caller environment tries to enable apply.
          CANARY_SWEEP_APPLY: "0"
        run: |
          set -euo pipefail
          : "${STRIPE_SECRET_KEY:?STRIPE_TEST_SECRET_KEY is missing}"
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *)
              echo "::error::STRIPE_TEST_SECRET_KEY must start with sk_test_."
              exit 1
              ;;
          esac
          output="$(node scripts/staging-canary-sweep.mjs)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" > "$RUNNER_TEMP/staging-canary-sweep.json"
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const lines = [
              "### Canary orphan sweep preflight",
              "",
              "- mode: dry run (no deletions)",
              "- cutoff: `" + plan.cutoff + "`",
              "- old subscriptions: **" + plan.subscriptions.length + "**",
              "- old customers: **" + plan.customers.length + "**",
            ];
            if (plan.subscriptions.length) {
              lines.push("- subscription IDs: " + plan.subscriptions.map((id) => "`" + id + "`").join(", "));
            }
            if (plan.customers.length) {
              lines.push("- customer IDs: " + plan.customers.map((id) => "`" + id + "`").join(", "));
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            const total = plan.subscriptions.length + plan.customers.length;
            if (total) {
              console.log("::warning::" + total + " old canary Stripe object(s) found; dry run only, nothing deleted.");
            }
          ' "$RUNNER_TEMP/staging-canary-sweep.json"

      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Database sweep preflight (dry run)
        env:
          STAGING_APP: streaminghub-staging
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?FLY_STAGING_API_TOKEN is missing}"
          # The remote command explicitly sets apply=0; no apply flag is passed.
          output="$(flyctl ssh console -a "$STAGING_APP" -C "env CANARY_DB_SWEEP_APPLY=0 node /app/scripts/staging-canary-db-sweep.mjs")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" > "$RUNNER_TEMP/staging-canary-db-sweep.json"
          node scripts/staging-canary-db-preflight-summary.mjs "$RUNNER_TEMP/staging-canary-db-sweep.json"

      - name: Run canary
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_APP: streaminghub-staging
          STAGING_CANARY_EMAIL: ${{ vars.STAGING_CANARY_EMAIL }}
          CANARY_EXPECT_COMMIT: ${{ steps.deployed_commit.outputs.sha || github.sha }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          CANARY_EXPECT_MAIL: sent
        run: |
          set -euo pipefail
          : "${STAGING_BASE_URL:?STAGING_BASE_URL is missing}"
          : "${STRIPE_SECRET_KEY:?STRIPE_TEST_SECRET_KEY is missing}"
          : "${STRIPE_PRICE_ID:?STRIPE_PRICE_ID is missing}"
          : "${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is missing}"
          : "${FLY_API_TOKEN:?FLY_STAGING_API_TOKEN is missing}"
          case "$STAGING_BASE_URL" in
            https://streaminghub.org|https://streaminghub.org/*)
              echo "::error::Refusing to run the canary against production."
              exit 1
              ;;
          esac
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *)
              echo "::error::STRIPE_TEST_SECRET_KEY must start with sk_test_."
              exit 1
              ;;
          esac
          node scripts/staging-canary.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "### Staging billing canary"
            echo
            echo "- target: \`${{ vars.STAGING_BASE_URL }}\`"
            echo "- commit: \`${{ steps.deployed_commit.outputs.sha || github.sha }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  test-slack:
    name: Send a test Slack notification
    if: github.event_name == 'workflow_dispatch' && inputs.test_slack
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send test message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::SLACK_WEBHOOK_URL is not configured as a repository secret."
            exit 1
          fi
          case "$SLACK_WEBHOOK_URL" in
            https://hooks.slack.com/*) ;;
            *)
              echo "::error::SLACK_WEBHOOK_URL must be a Slack incoming webhook URL."
              exit 1
              ;;
          esac
          text=":test_tube: *Test: Staging-Billing-Canary Slack-Alarm*"
          details=$(printf '%s\n' \
            "Commit: \`$COMMIT\`" \
            "Lauf: $RUN_URL" \
            "Diese Nachricht wurde manuell ausgelöst.")
          payload=$(jq -c -n --arg text "$text" --arg details "$details" '{text: ($text + "\n" + $details)}')
          curl --fail-with-body --silent --show-error --max-time 10 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

  notify:
    name: Notify about the scheduled canary
    needs: canary
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open or update the failure issue
        if: needs.canary.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Staging canary failing"
          body=$(printf '%s\n' \
            'Der tägliche Staging-Billing-Canary ist fehlgeschlagen.' \
            '' \
            "- Lauf: $RUN_URL" \
            "- Commit: $COMMIT" \
            "- Auslöser: schedule" \
            '' \
            'Bitte den Lauf und die Staging-Logs prüfen. Der Canary deckt Checkout, Webhook, E-Mail-Versand, Datenbankzustand und Cleanup ab; Produktionsdaten sind nicht beteiligt.' \
            '' \
            'Dieses Issue wird beim nächsten erfolgreichen täglichen Lauf automatisch geschlossen.')
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --limit 100 | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Notify Slack
        if: always() && needs.canary.result != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          RESULT: ${{ needs.canary.result }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured; skipping the Slack notification."
            exit 0
          fi
          case "$SLACK_WEBHOOK_URL" in
            https://hooks.slack.com/*) ;;
            *)
              echo "::error::SLACK_WEBHOOK_URL must be a Slack incoming webhook URL."
              exit 1
              ;;
          esac
          text=":rotating_light: *Staging-Billing-Canary fehlgeschlagen*"
          details=$(printf '%s\n' \
            "Ergebnis: \`$RESULT\`" \
            "Commit: \`$COMMIT\`" \
            "Lauf: $RUN_URL")
          payload=$(jq -c -n --arg text "$text" --arg details "$details" '{text: ($text + "\n" + $details)}')
          curl --fail-with-body --silent --show-error --max-time 10 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Close the failure issue after recovery
        if: needs.canary.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Staging canary failing"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --limit 100 | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -z "$existing" ]; then
            echo "No open canary failure issue."
            exit 0
          fi
          gh issue comment "$existing" --body "Der tägliche Staging-Canary läuft wieder erfolgreich: $RUN_URL"
          gh issue close "$existing" --reason completed
