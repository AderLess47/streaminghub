name: Staging-Deploy

# Runs after a green CI run on `main`, so staging always mirrors what passed the
# checks. The workflow never deploys the production app and never receives
# production Stripe or email credentials. `workflow_dispatch` stays as the way
# to roll back a staging-only problem or to re-deploy a specific commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy to staging
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf Fly-Staging deployen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    # `workflow_run` fires for failed, cancelled and pull-request runs too;
    # only a green push on `main` deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # On `workflow_run` GITHUB_SHA is the default-branch head, not the
          # commit CI passed; deploy the run that triggered this deploy.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}

      - name: Staging-Ziel prüfen
        env:
          FLY_STAGING_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_STAGING_API_TOKEN:-}" ]; then
            echo "::error::FLY_STAGING_API_TOKEN fehlt. Hinterlege es in der Staging-Umgebung."
            exit 1
          fi
          grep -qx 'app = "streaminghub-staging"' fly.staging.toml
          grep -q 'APP_URL = "https://streaminghub-staging.fly.dev"' fly.staging.toml
          if grep -q 'sk_live_' fly.staging.toml; then
            echo "::error::In fly.staging.toml steht ein Live-Stripe-Schlüssel. Deploy wird abgelehnt."
            exit 1
          fi
          if ! grep -q 'source = "streaminghub_staging_data"' fly.staging.toml; then
            echo "::error::Das Staging-Volume ist nicht konfiguriert. Deploy wird abgelehnt."
            exit 1
          fi
          echo "Staging target validated: streaminghub-staging / streaminghub_staging_data"

      - name: Deployten Commit ermitteln
        id: deployed_commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/deployed-commit"
          printf '%s\n' "$sha" > "$RUNNER_TEMP/deployed-commit/commit.txt"

      - name: Deployten Commit aufzeichnen
        uses: actions/upload-artifact@v4
        with:
          name: deployed-commit
          path: ${{ runner.temp }}/deployed-commit/commit.txt
          if-no-files-found: error

      - name: flyctl installieren
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deployen
        # Backstop: the shell timeout below reports the hang itself, but a stuck
        # flyctl process must not be able to hold the job either.
        timeout-minutes: 12
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          DEPLOY_COMMIT: ${{ steps.deployed_commit.outputs.sha }}
        run: |
          set -euo pipefail
          # A healthy staging deploy takes about two minutes. On 2026-11-18 the
          # remote builder hung and Fly only gave up after 16 minutes with
          # `deadline_exceeded`, leaving staging silently on the previous commit.
          # Cap the attempt ourselves so a hung build fails while somebody is
          # still watching, with a message that says what happened.
          DEPLOY_TIMEOUT_SECONDS=480
          set +e
          # The DNS check queries an external resolver (9.9.9.9) and can hang
          # on GitHub-hosted runners. The HTTP health check below is authoritative.
          timeout --kill-after=30 "$DEPLOY_TIMEOUT_SECONDS" flyctl deploy \
            --remote-only \
            --dns-checks=false \
            --config fly.staging.toml \
            --app streaminghub-staging \
            --ha=false \
            --build-arg "GIT_COMMIT=$DEPLOY_COMMIT"
          status=$?
          set -e
          # 124 = timeout fired, 137 = the process had to be killed.
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error title=Fly-Deploy hängt::flyctl deploy kam innerhalb von $((DEPLOY_TIMEOUT_SECONDS / 60)) Minuten nicht voran. Der Remote-Builder hängt höchstwahrscheinlich; Staging wurde nicht aktualisiert und liefert weiterhin den vorherigen Commit. Deploy erneut starten."
            exit 1
          fi
          exit "$status"

      - name: Staging-Zustand prüfen
        # HTTP 200 alone is not proof: a rolled back or half-finished rollout can
        # answer 200 while still serving the previous commit. The /status page
        # names the commit it runs, so require that commit to be the deployed one.
        env:
          EXPECTED_COMMIT: ${{ steps.deployed_commit.outputs.sha }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/staging-status.html"
          served=""
          code=""
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 10 -o "$status_file" -w '%{http_code}' https://streaminghub-staging.fly.dev/status || true)
            served=$(sed -n 's/.*data-deployment-commit="\([^"]*\)".*/\1/p' "$status_file" 2>/dev/null | head -1 || true)
            if [ "$code" = "200" ] && [ "$served" = "$EXPECTED_COMMIT" ]; then
              echo "Staging serves ${served} (HTTP 200) on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code:-no response}, serving commit ${served:-unknown} (expected ${EXPECTED_COMMIT}); retrying in 5s ..."
            sleep 5
          done
          echo "::error title=Staging liefert nicht den deployten Commit::Nach 120 Sekunden antwortete Staging mit HTTP ${code:-none} und Commit ${served:-unknown} statt ${EXPECTED_COMMIT}."
          exit 1

      - name: Staging-Abweichung melden
        # Runs whenever the job fails after the commit was resolved, so a failed
        # or hung deploy states explicitly which commit staging still serves
        # instead of leaving the drift to be discovered by a later canary run.
        if: failure()
        env:
          EXPECTED_COMMIT: ${{ steps.deployed_commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_COMMIT:-}" ]; then
            echo "The commit was not resolved before the failure; no drift to report."
            exit 0
          fi
          status_file="$RUNNER_TEMP/staging-drift.html"
          curl -sS --max-time 10 -o "$status_file" https://streaminghub-staging.fly.dev/status || true
          served=$(sed -n 's/.*data-deployment-commit="\([^"]*\)".*/\1/p' "$status_file" 2>/dev/null | head -1 || true)
          served="${served:-unknown}"
          if [ "$served" = "$EXPECTED_COMMIT" ]; then
            echo "Staging liefert bereits ${EXPECTED_COMMIT}; der Fehlschlag ist keine Staging-Abweichung." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Staging bleibt zurück"
            echo
            echo "- Beabsichtigter Commit: \`${EXPECTED_COMMIT}\`"
            echo "- Staging liefert: \`${served}\`"
            echo "- Lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Staging liefert weiter den vorherigen Commit, bis ein Deploy wieder gelingt; der nächste Canary-Lauf scheitert dann schon am Commit-Vergleich."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Staging bleibt zurück::Staging liefert ${served} statt ${EXPECTED_COMMIT}. Deploy erneut starten, damit der Canary nicht schon am Commit-Vergleich scheitert."
          exit 0

      - name: Next- und Cache-Proxy-Prozesse prüfen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          STAGING_APP: streaminghub-staging
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?FLY_STAGING_API_TOKEN is missing}"
          script_b64="$(base64 -w0 scripts/staging-process-check.cjs)"
          flyctl ssh console -a "$STAGING_APP" \
            -C "node -e \"eval(Buffer.from('${script_b64}','base64').toString())\""

      - name: Anonymen Cache-Treffer und Session-Bypass prüfen
        env:
          STAGING_BASE_URL: https://streaminghub-staging.fly.dev
        run: |
          set -euo pipefail
          node scripts/staging-cache-check.mjs "$STAGING_BASE_URL"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Staging-Deploy"
            echo
            echo "- Auslöser: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ steps.deployed_commit.outputs.sha }}\`"
            echo "- Ergebnis: ${{ job.status }}"
            echo "- Ziel: \`https://streaminghub-staging.fly.dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
