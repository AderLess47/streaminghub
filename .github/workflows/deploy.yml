name: Produktions-Deploy

# Nach jedem grünen CI-Lauf auf `main` geht genau der getestete Commit nach
# Produktion. `workflow_dispatch` bleibt als Notausgang: damit lässt sich ein
# älterer Commit oder ein Rollback ausrollen, ohne CI zu wiederholen.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf Fly deployen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `workflow_run` feuert auch für fehlgeschlagene oder abgebrochene Läufe
    # sowie für PRs. Ausgerollt wird nur ein erfolgreicher Push auf `main`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Bei `workflow_run` ist GITHUB_SHA der Kopf des Default-Branches,
          # nicht der Commit, der CI bestanden hat. Deshalb explizit der Lauf,
          # der den Deploy ausgelöst hat.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}

      # Der ausgerollte Commit wird aus dem Checkout gelesen, nicht aus
      # GITHUB_SHA: nur so stimmen Image, /status und der Prüfschritt überein.
      - name: Deployten Commit ermitteln
        id: deployed_commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pinned installer instead of a floating action, so a deploy never runs
      # code that changed since the last one.
      - name: flyctl installieren
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deployen
        # Ein hängender Remote-Builder soll den Job nicht 25 Minuten blockieren.
        timeout-minutes: 15
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_COMMIT: ${{ steps.deployed_commit.outputs.sha }}
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --config fly.toml --app streaminghub-org \
            --build-arg "GIT_COMMIT=$DEPLOY_COMMIT"

      - name: Prüfen, dass Produktion den deployten Commit liefert
        # HTTP 200 allein ist kein Beweis: eine zurückgerollte oder halb
        # abgeschlossene Ausrollung antwortet weiter mit dem alten Commit.
        # /status nennt den laufenden Commit, also muss er hier auftauchen –
        # sonst wäre ein automatischer Deploy unbemerkt ein Leerlauf.
        env:
          EXPECTED_COMMIT: ${{ steps.deployed_commit.outputs.sha }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/production-status.html"
          served=""
          code=""
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 10 -o "$status_file" -w '%{http_code}' https://streaminghub.org/status || true)
            served=$(sed -n 's/.*data-deployment-commit="\([^"]*\)".*/\1/p' "$status_file" 2>/dev/null | head -1 || true)
            if [ "$code" = "200" ] && [ "$served" = "$EXPECTED_COMMIT" ]; then
              echo "Production serves ${served} (HTTP 200) on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code:-no response}, serving commit ${served:-unknown} (expected ${EXPECTED_COMMIT}); retrying in 5s ..."
            sleep 5
          done
          echo "::error title=Produktion liefert nicht den deployten Commit::Nach 120 Sekunden antwortete Produktion mit HTTP ${code:-none} und Commit ${served:-unknown} statt ${EXPECTED_COMMIT}."
          exit 1

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Produktions-Deploy"
            echo
            echo "- Auslöser: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ steps.deployed_commit.outputs.sha }}\`"
            echo "- Ergebnis: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
