name: Apple app

# Baut die SwiftUI-App für iOS, tvOS und macOS und startet den iOS-Smoke-Test.
# Die Core-Tests laufen weiterhin in `ci.yml` auf Linux; hier geht es um das, was
# ohne Xcode ungeprüft bleibt.
#
# Die drei Plattformen laufen als eigene Jobs: nacheinander brauchte der Lauf
# rund acht Minuten, obwohl jeder Build unter zwei Minuten liegt. Jeder Job hat
# einen eigenen Runner, deshalb kosten sie sich keine CPU weg.
on:
  pull_request:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple-app.yml"

permissions:
  contents: read

concurrency:
  group: apple-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and smoke test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      # Der Simulator-Start dauert oft länger als der Build; er läuft deshalb
      # schon während des Builds im Hintergrund.
      - name: Boot simulator in the background
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in devices.values() for d in runtime if d["name"] == "iPhone 16"))
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build app and tests
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -scheme StreamingHub_iOS \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -quiet build-for-testing

      - name: Simulator smoke test
        working-directory: apple
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          rm -rf "$RUNNER_TEMP/smoke.xcresult"
          xcodebuild test-without-building \
            -scheme StreamingHub_iOS \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:StreamingHubUITests \
            -resultBundlePath "$RUNNER_TEMP/smoke.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet

          # Ein Lauf ohne ausgeführte Tests gilt nicht als bestanden.
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/smoke.xcresult" --format json > "$RUNNER_TEMP/smoke.json"
          python3 - "$RUNNER_TEMP/smoke.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          print(summary)
          if summary.get("totalTestCount", 0) < 1:
              sys.exit("Kein Test wurde ausgeführt.")
          if summary.get("failedTests", 0) or summary.get("result") != "Passed":
              sys.exit("Smoke-Test fehlgeschlagen.")
          PY

  tvos:
    name: tvOS build
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build tvOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -scheme StreamingHub_tvOS \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -quiet build

  macos:
    name: macOS build
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build macOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -scheme StreamingHub_macOS \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -quiet build
