name: Apple app

# Baut die SwiftUI-App für iOS, tvOS und macOS. Die Core-Tests laufen weiterhin in
# `ci.yml` auf Linux; hier geht es nur um das, was ohne Xcode ungeprüft bleibt:
# Compilerfehler in den App-Zielen.
on:
  pull_request:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple-app.yml"

permissions:
  contents: read

concurrency:
  group: apple-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apple app build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build iOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -scheme StreamingHub_iOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build

      - name: Simulator smoke test
        working-directory: apple
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/smoke.xcresult"
          xcodebuild test \
            -scheme StreamingHub_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            -only-testing:StreamingHubUITests \
            -resultBundlePath "$RUNNER_TEMP/smoke.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet

          # Ein Lauf ohne ausgeführte Tests gilt nicht als bestanden.
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/smoke.xcresult" --format json > "$RUNNER_TEMP/smoke.json"
          python3 - "$RUNNER_TEMP/smoke.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          print(summary)
          if summary.get("totalTestCount", 0) < 1:
              sys.exit("Kein Test wurde ausgeführt.")
          if summary.get("failedTests", 0) or summary.get("result") != "Passed":
              sys.exit("Smoke-Test fehlgeschlagen.")
          PY

      - name: Build tvOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -scheme StreamingHub_tvOS \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-tvos" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build

      - name: Build macOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -scheme StreamingHub_macOS \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-macos" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build
