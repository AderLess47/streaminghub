name: BFSG review

# Jährliche Erinnerung: Die Einordnung als Kleinstunternehmen nach § 2 Nr. 17
# BFSG hängt an Beschäftigtenzahl und Umsatz. Beides ändert sich, die Ausnahme
# nach § 3 Abs. 3 BFSG gilt nur so lange, wie die Schwelle eingehalten wird.
on:
  schedule:
    # 1. Februar, 07:00 UTC – nach dem Jahresabschluss des Vorjahres.
    - cron: "0 7 1 2 *"
  workflow_dispatch:
    inputs:
      max_days:
        description: "Grenzwert in Tagen – nur für einen Testlauf (leer lassen für 365)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    name: Check the BFSG classification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check decision date
        id: check
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.max_days }}" ]; then
            node scripts/bfsg-review.mjs --max-days "${{ inputs.max_days }}"
          else
            node scripts/bfsg-review.mjs
          fi

      - name: Open a review issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --search "BFSG-Prüfung" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "Offenes Issue existiert bereits, kein neues angelegt."
            exit 0
          fi
          body=$(printf '%s\n' \
            'Die jährliche Prüfung der BFSG-Einordnung steht an (siehe docs/BFSG-ANWENDUNGSBEREICH.md).' \
            '' \
            '- [ ] Beschäftigtenzahl (Vollzeitäquivalente) erheben' \
            '- [ ] Jahresumsatz oder Jahresbilanzsumme des letzten Geschäftsjahres erheben' \
            '- [ ] Gegen die Schwelle prüfen: unter 10 Personen und höchstens 2 Mio. €' \
            '- [ ] Ergebnis und Datum im Entscheidungsblock eintragen' \
            '- [ ] Bei geänderter Einordnung: Pflichten nach BFSG prüfen und /barrierefreiheit anpassen' \
            '- [ ] Issue schließen' \
            '' \
            'Hintergrund: § 3 Abs. 3 Satz 1 BFSG nimmt Kleinstunternehmen von den Pflichten für Dienstleistungen aus.' \
            'Sobald 10 oder mehr Personen beschäftigt werden oder Umsatz bzw. Bilanzsumme 2 Mio. € übersteigen, greifen die Pflichten.')
          gh issue create --title "BFSG-Prüfung fällig" --body "$body"

      # Ohne diesen Schritt bliebe der Lauf durch `continue-on-error` grün und
      # GitHub würde keine fehlgeschlagene Ausführung melden.
      - name: Fail so the overdue check is visible
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::BFSG-Prüfung überfällig – siehe docs/BFSG-ANWENDUNGSBEREICH.md"
          exit 1
