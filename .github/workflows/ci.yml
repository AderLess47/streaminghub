name: CI-Prüfungen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App-Versionen abgleichen
        run: npm run check:app-versions

      - name: Typecheck
        run: npm run typecheck

      - name: Test der Checkout-Zustimmung
        run: npm run test:checkout-consent

      # Die Vega-App ist ein eigenes Paket mit eigenen Abhaengigkeiten; die
      # Website-Pruefung blendet sie aus, damit beide Staende getrennt geprueft werden.
      - name: Typecheck der Vega-App
        working-directory: vega
        run: npm ci && npx tsc --noEmit

      # Parser und HLS-Nahtstelle der Vega-App unter Node; ein Virtual Device
      # braucht es dafuer nicht.
      - name: Vega-Logik-Tests
        working-directory: vega
        run: npm run test:headless

      # Fortschritt und Fortsetzen: App-Regeln gegen die Serverregeln aus
      # src/lib/watch-progress.ts.
      - name: Vega-Resume-Regeln
        working-directory: vega
        run: npm run test:resume

      - name: Test der Download-Seite
        run: npm run test:download-page

      - name: Test der Datenbankmigration
        run: npm run test:db-migration

      # Cloud-Backup: Verschlüsselung, Rechte, Aufbewahrung, Restore, SigV4.
      - name: Tests der Cloud-Backups
        run: npm run test:backup

      - name: Amazon-IAP-Belegtests
        run: npm run test:amazon-iap

      - name: Apple-IAP-Belegtests
        run: npm run test:apple-iap

      # Auslaufen, Wiederkauf und Dedupe der Abschlussmails.
      - name: Tests der Abo-Mails
        run: npm run test:subscription-mails

      # Ansprüche, Preise und Flags: Gerätegrenzen, Jahresabo, stabile Schlüssel.
      - name: Tests der Ansprüche und Preise
        run: npm run test:entitlements

      # Kündigungs-Rettung und Coupons: Angebot, doppelte Annahme, Conversion-Coupon.
      - name: Tests des Retention-Angebots
        run: npm run test:retention

      # Trial-Start: Migration der Alt-Datenbank, Missbrauchsschutz, Startmail, Rechte.
      - name: Tests des Trial-Starts
        run: npm run test:trial

      # Trial-Jobs: Erinnerung vor Ablauf, Ablaufmarkierung, Idempotenz.
      - name: Tests der Trial-Jobs
        run: npm run test:trial-jobs

      - name: Tests der Gerätebereinigung
        run: npm run test:device-cleanup

      - name: Tests der geräteübergreifenden Resume-Regeln
        run: npm run test:progress

      # App-API: Fortschritt, Geräte-Aktivierung, Playlist-Abruf.
      - name: Tests der API-Routen
        run: npm run test:api

      # Store-Refresh-Routen mit Auslaufmail, Wiederkauf und Dedupe.
      - name: Tests der Store-Refresh-Route
        run: npm run test:store-api

      # Stripe-Webhook: Signatur, Mailzyklus und Dedupe.
      - name: Tests der Stripe-Webhook-Route
        run: npm run test:stripe-webhook

      # Outbox: Zustellung, Wiederholversuche, Fehler und Suppression.
      - name: Tests der Mail-Outbox
        run: npm run test:mail-outbox

      # Resend-Webhook: Signatur, Zustellung und Sperrung von Adressen.
      - name: Tests des Resend-Webhooks
        run: npm run test:resend-webhook

      # Admin: Aufheben einer E-Mail-Sperre inklusive Audit-Eintrag.
      - name: Tests der Admin-Sperrliste
        run: npm run test:admin-suppression

      # Admin: erneuter Mailversand inklusive Audit-Metadaten.
      - name: Tests der Admin-Wiederholungen
        run: npm run test:admin-retry

      # Passwort-Reset: Anfrage, Token, neues Passwort, Login.
      - name: Tests des Passwort-Zurücksetzens
        run: npm run test:password-reset

      # E-Mail-Verifizierung: Registrierung, Link, erneuter Versand, Login.
      - name: Tests der E-Mail-Bestätigung
        run: npm run test:email-verification

      # MFA fuer Staff: zweiter Faktor, Recovery-Code, gesperrte Sitzung.
      - name: Tests der MFA-Anmeldung
        run: npm run test:mfa-login

      # Logout und Sitzungsablauf inklusive Sperre abgelaufener Sitzungen.
      - name: Tests der Sitzungsabmeldung
        run: npm run test:session-logout

      # Geraete-Kopplung vom Pairing-Code bis zum Geraete-Token.
      - name: Tests des Pairings
        run: npm run test:pairing

      # Geraet entfernen/sperren und sofortige Token-Sperre.
      - name: Tests des Geräte-Abmeldens
        run: npm run test:device-revoke

      # Datenexport und Loeschungsanfrage inklusive Passwortpruefung.
      - name: Tests der Datenauskunft
        run: npm run test:data-requests

      # Passwort aendern inklusive Abmeldung anderer Sitzungen.
      - name: Tests des Passwortwechsels
        run: npm run test:change-password

      # Support-Ticket vom Kunden bis zur Admin-Antwort.
      - name: Tests der Support-Tickets
        run: npm run test:support-tickets

      # Widerruf und Kuendigung inklusive Bestaetigung und Admin-Vermerk.
      - name: Tests für Widerruf und Kündigung
        run: npm run test:withdrawal-cancellation

      # Widerruf und Kündigung als Datensatz: Zeile, Referenz, Status, Kontozuordnung.
      - name: Tests der Vertragserklärungen
        run: npm run test:contracts

      # Kontaktformular: Spamschutz, Mail und Audit.
      - name: Tests des Kontaktformulars
        run: npm run test:contact-form

      # Kein `disabled` an den Knöpfen, solange eine Aktion läuft (#366/#367).
      - name: Fokus-Regeln der Formulare
        run: npm run test:pending-focus

      # Admin-Posteingang fuer Kontaktanfragen.
      - name: Tests des Admin-Kontaktpostfachs
        run: npm run test:admin-contacts

      # Aufbewahrung des Sicherheitsprotokolls (90 Tage).
      - name: Tests der Aufbewahrung des Audit-Logs
        run: npm run test:audit-retention

      # Staging canary: DB-/Outbox-Auswertung und Cleanup-Schutz.
      - name: Tests der Staging-Canary-Prüfungen
        run: npm run test:staging-canary

      # Meldung roter Deploy-/Smoke-Läufe: Titel, Text und Dedupe ohne GitHub.
      - name: Tests der Meldung roter Läufe
        run: npm run test:red-run-issue

      # Staging cache: only anonymous public HTML may be shared.
      - name: Tests des öffentlichen HTML-Caches
        run: npm run test:public-cache

      - name: Syntaxprüfung des Staging-Prozess-Checks
        run: node --check scripts/staging-process-check.cjs

      - name: Syntaxprüfung des Staging-Cache-Checks
        run: node --check scripts/staging-cache-check.mjs

  # Typecheck faengt Typfehler, aber keine Buildfehler: fehlgeschlagenes
  # Prerendering, verbotene Client-/Server-Importe oder PostCSS-Probleme fallen
  # erst beim next build auf. Der Build braucht keine Secrets.
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Next.js-Build
        run: npm run build

  # Builds the actual production image and starts the staging two-process
  # entrypoint. No Fly token or production secret is used.
  docker-staging-smoke:
    name: Staging image smoke test
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Staging-Image bauen
        run: |
          set -euo pipefail
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --tag streaminghub-staging-smoke \
            .

      - name: Zweiprozess-Staging-Entrypoint im Smoke-Test prüfen
        run: bash scripts/docker-staging-smoke.sh streaminghub-staging-smoke

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle-Caches gehoeren setup-gradle: setup-java mit "cache: gradle"
      # legt ~/.gradle vorher an, worauf setup-gradle Restore und Save
      # ueberspringt und jeder Lauf die Abhaengigkeiten neu laedt.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android-SDK-Pakete installieren
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager nicht unter $ANDROID_HOME gefunden" >&2
            exit 1
          fi
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            exit "$license_status"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      # Compiles main code and runs JVM/Robolectric tests for every distribution
      # flavor. No emulator is needed; device and DRM checks stay manual.
      # Maven Central drosselt geteilte CI-Adressen zeitweise mit HTTP 429; ein
      # neuer Lauf nach kurzer Pause loest das, ohne den Build zu aendern.
      - name: Unit-Tests für alle Flavors ausführen
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "Gradle-Lauf $attempt von 3"
            if ./gradlew --no-daemon testDirectDebugUnitTest testAmazonDebugUnitTest testPlayDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

  # macOS-Runner werden in diesem Repository sofort abgebrochen, deshalb laufen
  # die Core-Pruefungen in einem Linux-Container mit offizieller Swift-Toolchain.
  # Die SwiftUI-Oberflaeche selbst braucht Xcode und wird hier nicht gebaut.
  apple-core:
    name: Apple core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: StreamingHubCore testen
        run: |
          docker run --rm \
            -v "$PWD/apple":/src \
            -w /src \
            swift:5.10 \
            swift test
