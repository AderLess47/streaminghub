name: CI

on:
  pull_request:
    branches: [main]
  # The Android release workflow requests this check explicitly on its metadata
  # branch: pull requests opened with GITHUB_TOKEN do not trigger pull_request events.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Download page test
        run: npm run test:download-page

      - name: Database migration test
        run: npm run test:db-migration
