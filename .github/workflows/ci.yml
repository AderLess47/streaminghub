name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Die Vega-App ist ein eigenes Paket mit eigenen Abhaengigkeiten; die
      # Website-Pruefung blendet sie aus, damit beide Staende getrennt geprueft werden.
      - name: Typecheck Vega app
        working-directory: vega
        run: npm ci && npx tsc --noEmit

      - name: Download page test
        run: npm run test:download-page

      - name: Database migration test
        run: npm run test:db-migration

      - name: Amazon IAP receipt tests
        run: npm run test:amazon-iap

      - name: Test cross-device resume rules
        run: npm run test:progress

  # Der Apple-Teil braucht Xcode; die Core-Bibliothek laesst sich ohne UI testen,
  # die App selbst wird gegen das iOS-Simulator-SDK gebaut.
  apple:
    name: Apple app
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test StreamingHubCore
        working-directory: apple
        run: swift test

      - name: Generate Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS app
        working-directory: apple
        run: |
          xcodebuild -project StreamingHub.xcodeproj -scheme StreamingHub \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
