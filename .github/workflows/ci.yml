name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Die Vega-App ist ein eigenes Paket mit eigenen Abhaengigkeiten; die
      # Website-Pruefung blendet sie aus, damit beide Staende getrennt geprueft werden.
      - name: Typecheck Vega app
        working-directory: vega
        run: npm ci && npx tsc --noEmit

      # Parser und HLS-Nahtstelle der Vega-App unter Node; ein Virtual Device
      # braucht es dafuer nicht.
      - name: Vega logic tests
        working-directory: vega
        run: npm run test:headless

      # Fortschritt und Fortsetzen: App-Regeln gegen die Serverregeln aus
      # src/lib/watch-progress.ts.
      - name: Vega resume rules
        working-directory: vega
        run: npm run test:resume

      - name: Download page test
        run: npm run test:download-page

      - name: Database migration test
        run: npm run test:db-migration

      - name: Amazon IAP receipt tests
        run: npm run test:amazon-iap

      - name: Apple IAP receipt tests
        run: npm run test:apple-iap

      - name: Test cross-device resume rules
        run: npm run test:progress

  # macOS-Runner werden in diesem Repository sofort abgebrochen, deshalb laufen
  # die Core-Pruefungen in einem Linux-Container mit offizieller Swift-Toolchain.
  # Die SwiftUI-Oberflaeche selbst braucht Xcode und wird hier nicht gebaut.
  apple-core:
    name: Apple core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test StreamingHubCore
        run: |
          docker run --rm \
            -v "$PWD/apple":/src \
            -w /src \
            swift:5.10 \
            swift test
