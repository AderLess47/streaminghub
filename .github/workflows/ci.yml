name: CI-Prüfungen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App-Versionen abgleichen
        run: npm run check:app-versions

      - name: Typecheck
        run: npm run typecheck

      - name: Test der Checkout-Zustimmung
        run: npm run test:checkout-consent

      # Die Vega-App ist ein eigenes Paket mit eigenen Abhaengigkeiten; die
      # Website-Pruefung blendet sie aus, damit beide Staende getrennt geprueft werden.
      - name: Typecheck der Vega-App
        working-directory: vega
        run: npm ci && npx tsc --noEmit

      # Parser und HLS-Nahtstelle der Vega-App unter Node; ein Virtual Device
      # braucht es dafuer nicht.
      - name: Vega-Logik-Tests
        working-directory: vega
        run: npm run test:headless

      # Fortschritt und Fortsetzen: App-Regeln gegen die Serverregeln aus
      # src/lib/watch-progress.ts.
      - name: Vega-Resume-Regeln
        working-directory: vega
        run: npm run test:resume

      - name: Test der Download-Seite
        run: npm run test:download-page

      - name: Test der Datenbankmigration
        run: npm run test:db-migration

      # Cloud-Backup: Verschlüsselung, Rechte, Aufbewahrung, Restore, SigV4.
      - name: Tests der Cloud-Backups
        run: npm run test:backup

      - name: Amazon-IAP-Belegtests
        run: npm run test:amazon-iap

      - name: Apple-IAP-Belegtests
        run: npm run test:apple-iap

      # Auslaufen, Wiederkauf und Dedupe der Abschlussmails.
      - name: Tests der Abo-Mails
        run: npm run test:subscription-mails

      # Ansprüche, Preise und Flags: Gerätegrenzen, Jahresabo, stabile Schlüssel.
      - name: Tests der Ansprüche und Preise
        run: npm run test:entitlements

      # Kündigungs-Rettung und Coupons: Angebot, doppelte Annahme, Conversion-Coupon.
      - name: Tests des Retention-Angebots
        run: npm run test:retention

      # Trial-Start: Migration der Alt-Datenbank, Missbrauchsschutz, Startmail, Rechte.
      - name: Tests des Trial-Starts
        run: npm run test:trial

      # Trial-Jobs: Erinnerung vor Ablauf, Ablaufmarkierung, Idempotenz.
      - name: Tests der Trial-Jobs
        run: npm run test:trial-jobs

      - name: Tests der Gerätebereinigung
        run: npm run test:device-cleanup

      - name: Tests der geräteübergreifenden Resume-Regeln
        run: npm run test:progress

      # App-API: Fortschritt, Geräte-Aktivierung, Playlist-Abruf.
      - name: Tests der API-Routen
        run: npm run test:api

      # Store-Refresh-Routen mit Auslaufmail, Wiederkauf und Dedupe.
      - name: Tests der Store-Refresh-Route
        run: npm run test:store-api

      # Stripe-Webhook: Signatur, Mailzyklus und Dedupe.
      - name: Tests der Stripe-Webhook-Route
        run: npm run test:stripe-webhook

      # Outbox: Zustellung, Wiederholversuche, Fehler und Suppression.
      - name: Tests der Mail-Outbox
        run: npm run test:mail-outbox

      # Resend-Webhook: Signatur, Zustellung und Sperrung von Adressen.
      - name: Tests des Resend-Webhooks
        run: npm run test:resend-webhook

      # Admin: Aufheben einer E-Mail-Sperre inklusive Audit-Eintrag.
      - name: Tests der Admin-Sperrliste
        run: npm run test:admin-suppression

      # Admin: erneuter Mailversand inklusive Audit-Metadaten.
      - name: Tests der Admin-Wiederholungen
        run: npm run test:admin-retry

      # Passwort-Reset: Anfrage, Token, neues Passwort, Login.
      - name: Tests des Passwort-Zurücksetzens
        run: npm run test:password-reset

      # E-Mail-Verifizierung: Registrierung, Link, erneuter Versand, Login.
      - name: Tests der E-Mail-Bestätigung
        run: npm run test:email-verification

      # MFA fuer Staff: zweiter Faktor, Recovery-Code, gesperrte Sitzung.
      - name: Tests der MFA-Anmeldung
        run: npm run test:mfa-login

      # Logout und Sitzungsablauf inklusive Sperre abgelaufener Sitzungen.
      - name: Tests der Sitzungsabmeldung
        run: npm run test:session-logout

      # Geraete-Kopplung vom Pairing-Code bis zum Geraete-Token.
      - name: Tests des Pairings
        run: npm run test:pairing

      # Geraet entfernen/sperren und sofortige Token-Sperre.
      - name: Tests des Geräte-Abmeldens
        run: npm run test:device-revoke

      # Datenexport und Loeschungsanfrage inklusive Passwortpruefung.
      - name: Tests der Datenauskunft
        run: npm run test:data-requests

      # Passwort aendern inklusive Abmeldung anderer Sitzungen.
      - name: Tests des Passwortwechsels
        run: npm run test:change-password

      # Support-Ticket vom Kunden bis zur Admin-Antwort.
      - name: Tests der Support-Tickets
        run: npm run test:support-tickets

      # Widerruf und Kuendigung inklusive Bestaetigung und Admin-Vermerk.
      - name: Tests für Widerruf und Kündigung
        run: npm run test:withdrawal-cancellation

      # Widerruf und Kündigung als Datensatz: Zeile, Referenz, Status, Kontozuordnung.
      - name: Tests der Vertragserklärungen
        run: npm run test:contracts

      # Kontaktformular: Spamschutz, Mail und Audit.
      - name: Tests des Kontaktformulars
        run: npm run test:contact-form

      # Kein `disabled` an den Knöpfen, solange eine Aktion läuft (#366/#367).
      - name: Fokus-Regeln der Formulare
        run: npm run test:pending-focus

      # Admin-Posteingang fuer Kontaktanfragen.
      - name: Tests des Admin-Kontaktpostfachs
        run: npm run test:admin-contacts

      # Aufbewahrung des Sicherheitsprotokolls (90 Tage).
      - name: Tests der Aufbewahrung des Audit-Logs
        run: npm run test:audit-retention

      # Staging canary: DB-/Outbox-Auswertung und Cleanup-Schutz.
      - name: Tests der Staging-Canary-Prüfungen
        run: npm run test:staging-canary

      # Meldung roter Deploy-/Smoke-Läufe: Titel, Text und Dedupe ohne GitHub.
      - name: Tests der Meldung roter Läufe
        run: npm run test:red-run-issue

      # Staging cache: only anonymous public HTML may be shared.
      - name: Tests des öffentlichen HTML-Caches
        run: npm run test:public-cache

      # Gegenprobe fuer den Download-Zeitdeckel-Check im Lint-Job: ohne diese
      # Faelle koennte die Pruefung still kaputtgehen und ungedeckelte Aufrufe
      # durchwinken, statt den Job rot zu machen.
      - name: Tests der Download-Zeitdeckel-Prüfung
        run: npm run test:curl-timeouts

      # Die Pin-Pruefung ist nur so gut wie ihre Faelle: ohne Tests koennte
      # sie eine Zeile ohne SHA still durchwinken, statt den Job rot zu machen.
      - name: Tests der Action-Pin-Prüfung
        run: npm run test:action-pins

      - name: Syntaxprüfung des Staging-Prozess-Checks
        run: node --check scripts/staging-process-check.cjs

      - name: Syntaxprüfung des Staging-Cache-Checks
        run: node --check scripts/staging-cache-check.mjs

  # Prueft alle Workflow-Dateien, auch die nur manuell startbaren
  # (android-release, vega-shaka): Syntax, Ereignis- und Input-Namen,
  # Ausdruecke, Action-Eingaben und Runner-Labels. yaml.safe_load findet
  # davon nur die groebsten Syntaxfehler. Dazu kommt die Dependabot-Config,
  # die actionlint nicht kennt (siehe Schritt unten).
  workflows:
    name: Workflow-Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # SHA-256 des Release-Archivs von actionlint 1.7.12 (linux_amd64). Der
      # Wert steht im Repo und ist damit im Pull Request geprueft; eine
      # mitgeladene Pruefsummendatei kaeme aus derselben Quelle wie das Archiv.
      # Bei einem Versionswechsel URL und Hash gemeinsam anpassen.
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Download, Pruefsumme und Lauf in einem Schritt: das Binary liegt nur in
      # $RUNNER_TEMP und muss nicht ueber $GITHUB_PATH weitergereicht werden.
      # shellcheck aus: dessen Befunde haengen von der Runner-Version ab und
      # gehoeren nicht zu dieser Pruefung; Ausdruecke, Inputs und Labels
      # prueft actionlint selbst.
      #
      # Zeitdeckel: alle Downloads in diesem Job nutzen dieselben Werte wie der
      # Robolectric-Schritt in jobs.android (siehe Kommentar dort):
      # --connect-timeout 10, --max-time 180 je Transfer, --speed-limit 1024
      # --speed-time 30 gegen steckengebliebene Transfers und --retry 3 im
      # --retry-max-time-Fenster von 120 s. Vorher lief ein haengender Download
      # mit --retry 5 ohne Deckel bis zum 10-Minuten-Job-Timeout, statt zu
      # scheitern.
      - name: Workflows pruefen
        run: |
          curl -fsSL \
            --connect-timeout 10 --max-time 180 --speed-limit 1024 --speed-time 30 \
            --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors \
            -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck=

      # Dependabot prueft .github/dependabot.yml nur beim eigenen Lauf und
      # verwirft eine fehlerhafte Datei still - es entstehen dann einfach keine
      # PRs mehr, ohne roten Job. actionlint deckt die Datei nicht ab. Geprueft
      # wird deshalb gegen das offizielle Schema dependabot-2.0.json
      # (draft-07) aus SchemaStore: was dort durchfaellt, lehnt auch Dependabot
      # ab. Das Schema entscheidet, nicht eine Liste im Repo - so wird keine
      # gueltige Config rot.
      # Wie bei actionlint stehen alle Staende im Repo und sind damit im Pull
      # Request geprueft: yajsv 1.4.1 (linux_amd64) und das Schema auf dem
      # Commit aa428f6 festgenagelt, beide per SHA-256 geprueft. Bei einem
      # Wechsel Version, Commit, URL und Hash gemeinsam anpassen.
      - name: Dependabot-Konfiguration pruefen
        env:
          YAJVSV_SHA256: "4bd6d2b1d6292ab1f7ba63db83c182a603a790d431429cf71f05cb0fcc677def"
          DEPENDABOT_SCHEMA_SHA256: "891027089ecaeaf235ba78fa6ec255542a49465e6cb71ffb92606a2d9edbc1ea"
          DEPENDABOT_SCHEMA_URL: "https://raw.githubusercontent.com/SchemaStore/schemastore/aa428f6a0d322aff9ec6828c15bf5d42bd37f60f/src/schemas/json/dependabot-2.0.json"
        run: |
          curl -fsSL \
            --connect-timeout 10 --max-time 180 --speed-limit 1024 --speed-time 30 \
            --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors \
            -o "$RUNNER_TEMP/yajsv" \
            "https://github.com/neilpa/yajsv/releases/download/v1.4.1/yajsv.linux.amd64"
          echo "$YAJVSV_SHA256  $RUNNER_TEMP/yajsv" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yajsv"
          curl -fsSL \
            --connect-timeout 10 --max-time 180 --speed-limit 1024 --speed-time 30 \
            --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors \
            -o "$RUNNER_TEMP/dependabot-2.0.json" "$DEPENDABOT_SCHEMA_URL"
          echo "$DEPENDABOT_SCHEMA_SHA256  $RUNNER_TEMP/dependabot-2.0.json" | sha256sum -c -
          # yajsv meldet "pass" und Exit 0; Exit 1 = Schema-Verstoss,
          # Exit 2 = Datei ist kein gueltiges YAML.
          "$RUNNER_TEMP/yajsv" -s "$RUNNER_TEMP/dependabot-2.0.json" .github/dependabot.yml

      # Actions duerfen nicht wieder auf bewegliche Tags zeigen: ein
      # verschobener Tag liefe ungeprueft in Jobs mit Deploy- und
      # Zugangs-Secrets. Verlangt wird der Commit-SHA des Release-Tags mit dem
      # Tag als Kommentar ("uses: owner/action@<sha> # v5") - genau die
      # Schreibweise, die Dependabot pflegt. Lokale Aktionen (./...) brauchen
      # keinen Pin, docker:// einen Digest. Faelle in
      # scripts/check-action-pins.test.mjs.
      - name: Action-Pins pruefen
        run: npm run check:action-pins

      # Zeitdeckel: ein Download ohne Deckel laeuft bis zum Job-Timeout (10
      # bzw. 30 Minuten), statt zu scheitern - das war der Robolectric-Vorfall
      # vor #427. Der Check deckt .github, ops, scripts, vega, apple, android
      # und die Repo-Wurzel ab: curl braucht --max-time, wget nur den
      # timeout-Wrapper (--timeout/-T deckelt bloss DNS, Verbinden und Lesen),
      # ein fetch-Download AbortSignal.timeout; Deckel
      # aus gesourcten Lib-Dateien werden aufgeloest. Er wird rot, sobald ein
      # Aufruf den Deckel verliert oder ein neuer ohne Deckel dazukommt.
      - name: Zeitdeckel der Download-Aufrufe pruefen
        run: npm run check:curl-timeouts

  # Typecheck faengt Typfehler, aber keine Buildfehler: fehlgeschlagenes
  # Prerendering, verbotene Client-/Server-Importe oder PostCSS-Probleme fallen
  # erst beim next build auf. Der Build braucht keine Secrets.
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Next.js-Build
        run: npm run build

  # Builds the actual production image and starts the staging two-process
  # entrypoint. No Fly token or production secret is used.
  docker-staging-smoke:
    name: Staging image smoke test
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Staging-Image bauen
        run: |
          set -euo pipefail
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --tag streaminghub-staging-smoke \
            .

      - name: Zweiprozess-Staging-Entrypoint im Smoke-Test prüfen
        run: bash scripts/docker-staging-smoke.sh streaminghub-staging-smoke

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Einzige Quelle fuer die Jar-Staende (aus DefaultSdkProvider: SDK 34
      # fuer die Tests, SDK 35 fuer das App-Paket). Fordert ein Robolectric-
      # Update andere Staende an, scheitern die Tests offline mit dem exakten
      # fehlenden Jar-Namen - dann diese Liste nachziehen.
      ROBOLECTRIC_JARS: "14-robolectric-10818077-i7 15-robolectric-12650502-i7"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Java 17 einrichten
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle-Caches gehoeren setup-gradle: setup-java mit "cache: gradle"
      # legt ~/.gradle vorher an, worauf setup-gradle Restore und Save
      # ueberspringt und jeder Lauf die Abhaengigkeiten neu laedt.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.11.1"

      - name: Android-SDK-Pakete installieren
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager nicht unter $ANDROID_HOME gefunden" >&2
            exit 1
          fi
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            exit "$license_status"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      # Robolectric laedt android-all-instrumented zur Testlaufzeit selbst von
      # Maven Central und lief dabei in den 429. Die Staende aus
      # ROBOLECTRIC_JARS werden vorab geladen; scheitert das, wird der Job rot,
      # statt still in den Online-Modus zu fallen.
      #
      # Zeitbudget: Der Job hat 25 Minuten (timeout-minutes, oben). Die Jars
      # sind 151 MB und 199 MB gross, Maven Central drosselt geteilte
      # CI-Adressen mit HTTP 429. Mit den alten Werten (--retry 8,
      # --retry-delay 15, --max-time 300) konnte ein einzelnes Jar rechnerisch
      # knapp 40 Minuten brauchen; im Lauf 45059527056 blieb der Schritt nach
      # einem 429 stehen, bis der 25-Minuten-Job-Timeout ihn abbrach, statt
      # sauber zu scheitern. Deshalb jetzt:
      #   --connect-timeout 10            Verbindungsaufbau
      #   --max-time 180                  ein Transfer, danach Retry
      #   --speed-limit 1024 --speed-time 30
      #                                   haengender Transfer bricht nach 30 s
      #                                   ab, statt bis --max-time zu warten
      #   --retry 3 --retry-delay 15 --retry-max-time 120
      #                                   hoechstens 3 weitere Versuche, alle im
      #                                   120-s-Fenster; danach ist Schluss
      # Worst Case also ~3 Minuten je Jar (gemessen gegen einen 429-Server und
      # gegen einen haengenden Transfer: 45 s bzw. 120 s), beide ~6; der
      # Schritt bricht zusaetzlich per timeout-minutes 10 ab. Der Testschritt
      # braucht mit seinen 3 Versuchen (~3 min + 30 s + 60 s Pause) ~10 Minuten,
      # zusammen also ~16 von 25 Minuten - der Job scheitert damit sichtbar,
      # statt im Timeout zu verschwinden.
      #
      # Der Cache nimmt beiden Jars den Download ganz ab: der 429 trifft nur
      # noch den ersten Lauf nach einer Aenderung an ROBOLECTRIC_JARS.
      - name: Robolectric-Jars aus dem Cache holen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/robolectric-deps
          # Der Jar-Stand ist die einzige Aenderungsquelle. Bewusst ohne
          # restore-keys: ein alter Stand wuerde Offline-Laeufe mit dem
          # falschen Jar brechen, statt sie neu zu laden.
          key: robolectric-deps-${{ runner.os }}-${{ env.ROBOLECTRIC_JARS }}

      - name: Robolectric-Laufzeit vorab laden
        timeout-minutes: 10
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/robolectric-deps"
          mkdir -p "$deps"
          for artifact in $ROBOLECTRIC_JARS; do
            target="$deps/android-all-instrumented-$artifact.jar"
            # Cache-Treffer: ein vollstaendiges Jar ist > 100 MB. Kleinere
            # Dateien sind Reste eines abgebrochenen Downloads und werden
            # erneut geladen.
            if [ -f "$target" ] && [ "$(stat -c %s "$target")" -ge 100000000 ]; then
              echo "Robolectric-Jar $artifact: $(stat -c %s "$target") Bytes aus dem Cache."
              continue
            fi
            status=0
            curl -fsSL \
              --connect-timeout 10 --max-time 180 --speed-limit 1024 --speed-time 30 \
              --retry 3 --retry-delay 15 --retry-max-time 120 --retry-all-errors \
              -o "$target" \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$artifact/android-all-instrumented-$artifact.jar" || status=$?
            if [ "$status" -ne 0 ]; then
              rm -f "$target"
              # curl-Exitcodes: 22 = HTTP-Fehler (z. B. 429), 28 = Timeout.
              echo "::error::Robolectric-Jar $artifact konnte nicht von Maven Central geladen werden (curl exit $status)."
              exit 1
            fi
            echo "Robolectric-Jar $artifact: $(stat -c %s "$target") Bytes geladen."
          done

      # Compiles main code and runs JVM/Robolectric tests for every distribution
      # flavor. No emulator is needed; device and DRM checks stay manual.
      # Maven Central drosselt geteilte CI-Adressen zeitweise mit HTTP 429; ein
      # neuer Lauf nach kurzer Pause loest das, ohne den Build zu aendern.
      - name: Unit-Tests für alle Flavors ausführen
        working-directory: android
        run: |
          export JAVA_TOOL_OPTIONS="-Drobolectric.offline=true -Drobolectric.dependency.dir=$RUNNER_TEMP/robolectric-deps"
          for attempt in 1 2 3; do
            echo "Gradle-Lauf $attempt von 3"
            if ./gradlew --no-daemon testDirectDebugUnitTest testAmazonDebugUnitTest testPlayDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

  # macOS-Runner werden in diesem Repository sofort abgebrochen, deshalb laufen
  # die Core-Pruefungen in einem Linux-Container mit offizieller Swift-Toolchain.
  # Die SwiftUI-Oberflaeche selbst braucht Xcode und wird hier nicht gebaut.
  apple-core:
    name: Apple core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: StreamingHubCore testen
        run: |
          docker run --rm \
            -v "$PWD/apple":/src \
            -w /src \
            swift:5.10 \
            swift test
