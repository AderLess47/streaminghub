name: Backup-Prüfung

# Read-only operational check. It lists the daily backups on the production
# volume and never prints the database or any secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Produktions-Backups auflisten
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: flyctl installieren
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Backup-Dateien auflisten
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console \
            --app streaminghub-org \
            --user nextjs \
            -C "sh -lc 'date -u; echo; ls -lt /app/data/backups | head -10; echo; du -sh /app/data/backups'"
