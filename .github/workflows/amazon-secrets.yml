name: Amazon-Secrets einrichten

# Copies the Amazon IAP values from the repository secrets to Fly, so nobody has
# to install flyctl or handle the FLY_API_TOKEN. Values are never echoed: only the
# names of the variables that were sent appear in the log.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-secrets
  cancel-in-progress: false

jobs:
  configure:
    name: Amazon-Secrets nach Fly übertragen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: flyctl installieren
        run: |
          set -euo pipefail
          # Zeitdeckel wie im Robolectric-Schritt: kein Hang bis zum Job-Timeout.
          curl -fsSL \
            --connect-timeout 10 --max-time 180 --speed-limit 1024 --speed-time 30 \
            --retry 3 --retry-delay 15 --retry-max-time 120 \
            https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Secrets auf streaminghub-org setzen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RVS_SECRET: ${{ secrets.AMAZON_RVS_SHARED_SECRET }}
          RVS_SANDBOX: ${{ secrets.AMAZON_RVS_SANDBOX }}
          RTN_TOPIC: ${{ secrets.AMAZON_RTN_TOPIC_ARN }}
          SYNC_TOKEN: ${{ secrets.AMAZON_SYNC_TOKEN }}
          IAP_SKU: ${{ secrets.AMAZON_IAP_SKU }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${RVS_SECRET}" ]; then args+=("AMAZON_RVS_SHARED_SECRET=${RVS_SECRET}"); fi
          if [ -n "${RVS_SANDBOX}" ]; then args+=("AMAZON_RVS_SANDBOX=${RVS_SANDBOX}"); fi
          if [ -n "${RTN_TOPIC}" ]; then args+=("AMAZON_RTN_TOPIC_ARN=${RTN_TOPIC}"); fi
          if [ -n "${SYNC_TOKEN}" ]; then args+=("AMAZON_SYNC_TOKEN=${SYNC_TOKEN}"); fi
          if [ -n "${IAP_SKU}" ]; then args+=("AMAZON_IAP_SKU=${IAP_SKU}"); fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo "::notice title=Nichts zu konfigurieren::Keines der AMAZON_*-Repository-Secrets ist gesetzt."
            exit 0
          fi

          names=$(printf '%s\n' "${args[@]}" | cut -d= -f1 | paste -sd, -)
          flyctl secrets set "${args[@]}" --app streaminghub-org
          {
            echo "### Amazon-Secrets eingerichtet"
            echo
            echo "An Fly übertragen (Werte ausgeblendet): \`${names}\`"
            echo
            echo "Fly startet die Maschine automatisch neu; die Amazon-Endpunkte antworten"
            echo "danach mit \`401 unauthorized\` statt \`503 not_configured\`."
          } >> "$GITHUB_STEP_SUMMARY"
