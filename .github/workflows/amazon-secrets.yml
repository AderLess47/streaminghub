name: Configure Amazon secrets

# Copies the Amazon IAP values from the repository secrets to Fly, so nobody has
# to install flyctl or handle the FLY_API_TOKEN. Values are never echoed: only the
# names of the variables that were sent appear in the log.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-secrets
  cancel-in-progress: false

jobs:
  configure:
    name: Push Amazon secrets to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Set secrets on streaminghub-org
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RVS_SECRET: ${{ secrets.AMAZON_RVS_SHARED_SECRET }}
          RVS_SANDBOX: ${{ secrets.AMAZON_RVS_SANDBOX }}
          RTN_TOPIC: ${{ secrets.AMAZON_RTN_TOPIC_ARN }}
          SYNC_TOKEN: ${{ secrets.AMAZON_SYNC_TOKEN }}
          IAP_SKU: ${{ secrets.AMAZON_IAP_SKU }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${RVS_SECRET}" ]; then args+=("AMAZON_RVS_SHARED_SECRET=${RVS_SECRET}"); fi
          if [ -n "${RVS_SANDBOX}" ]; then args+=("AMAZON_RVS_SANDBOX=${RVS_SANDBOX}"); fi
          if [ -n "${RTN_TOPIC}" ]; then args+=("AMAZON_RTN_TOPIC_ARN=${RTN_TOPIC}"); fi
          if [ -n "${SYNC_TOKEN}" ]; then args+=("AMAZON_SYNC_TOKEN=${SYNC_TOKEN}"); fi
          if [ -n "${IAP_SKU}" ]; then args+=("AMAZON_IAP_SKU=${IAP_SKU}"); fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo "::notice title=Nothing to configure::None of the AMAZON_* repository secrets is set."
            exit 0
          fi

          names=$(printf '%s\n' "${args[@]}" | cut -d= -f1 | paste -sd, -)
          flyctl secrets set "${args[@]}" --app streaminghub-org
          {
            echo "### Amazon secrets configured"
            echo
            echo "Sent to Fly (values hidden): \`${names}\`"
            echo
            echo "Fly restarts the machine automatically; the Amazon endpoints answer"
            echo "\`401 unauthorized\` instead of \`503 not_configured\` afterwards."
          } >> "$GITHUB_STEP_SUMMARY"
