name: Deploy-Smoke-Test

on:
  schedule:
    # Every six hours, so a manual `flyctl deploy` cannot stay unverified for long.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Deployten Release prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No dependency install: the script uses fetch and node:crypto only.
      - name: /download, /api/release und /app.apk vergleichen
        run: node scripts/deploy-smoke.mjs --wait 120
