# Dependabot haelt die Actions in .github/workflows nach. Ohne diese Datei
# mussten Versionssprunge von Hand nachgezogen werden (#418, #419, #420).
# Bewusst nur "github-actions" und "docker": npm, Gradle, CocoaPods und
# SwiftPM haben eigene Wege und wuerden hier nur zusaetzliche PRs erzeugen.
#
# Alle Actions sind auf den Commit-SHA gepinnt, mit dem Release-Tag als
# Kommentar dahinter ("uses: owner/action@<sha> # v5"). Dependabot versteht
# diese Schreibweise und aktualisiert SHA und Kommentar gemeinsam; von Hand
# bitte nie auf einen beweglichen Tag zurueckstellen.
version: 2

updates:
  - package-ecosystem: "github-actions"
    # "/" deckt alle Workflows unter .github/workflows ab, auch die nur
    # manuell startbaren (android-release, vega-shaka).
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # Genug Platz fuer einen Major-Sprung je Action, ohne die Liste zu fluten.
    open-pull-requests-limit: 5
    commit-message:
      # Passt zur bisherigen Schreibweise der Workflow-Commits ("ci: ...").
      prefix: "ci"
    groups:
      # Minor und Patch gebuendelt: kleiner Diff, den die CI-Pruefungen
      # (Typecheck, Build, Android, Apple, Workflow-Lint) abdecken.
      # Major-Spruenge wie v6 -> v7 bleiben absichtlich Einzel-PRs, damit sie
      # getrennt geprueft und gemergt werden.
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Das Basis-Image im Dockerfile ist per Tag und Digest gepinnt
  # (node:22-bookworm-slim@sha256:...). Ohne diesen Eintrag friert der Digest
  # ein: neue Node-22-Patchversionen und Sicherheitsupdates kaemen nur noch von
  # Hand ins Image, waehrend das Pinning genau das verhindern soll, dass ein
  # beweglicher Tag ungeprueft mitwandert. Dependabot zieht den Digest unter
  # demselben Tag nach (und hebt bei einem neuen Major den Tag mit an), sodass
  # beide Ziele zusammenpassen: unveraenderlich im Build, aktuell im Betrieb.
  - package-ecosystem: "docker"
    # "/" ist das Verzeichnis des Dockerfile in der Repo-Wurzel. Dependabot
    # sucht dort nicht rekursiv: ein Dockerfile in einem Unterverzeichnis
    # braucht einen eigenen Eintrag (bzw. einen Wert in "directories"), sonst
    # bleibt es ungepflegt. check:dependabot-coverage meldet genau das.
    directory: "/"
    schedule:
      # Gleicher Slot wie die Actions: ein fester Review-Termin pro Woche
      # statt verteilter PRs ueber den Tag.
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # Ein Basis-Image in drei FROM-Zeilen: Dependabot aktualisiert sie in einem
    # PR. Mehr als zwei offene PRs waeren hier nur Rauschen.
    open-pull-requests-limit: 2
    commit-message:
      # Passt zur bisherigen Schreibweise der Workflow- und Image-Commits.
      prefix: "ci"
